<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GameHubs · 站群工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#keywords"><span class="brandmark">G</span> GameHubs<span class="local">LOCAL</span></a><div class="workspace">站群工作台</div><nav aria-label="主导航"><button data-view="keywords" class="active">关键词池 <b id="nav-count"></b></button><button data-view="builds">建站清单</button><button data-view="sites">网站目录</button></nav><div class="sidebar-note"><span class="online-dot"></span> 本地工作区<button id="help">使用说明</button></div></aside>
<main><header><div class="breadcrumb">工作区 <span>/</span> <span id="crumb">关键词池</span></div><div class="header-actions"><span id="sync-label">正在读取…</span><button id="refresh">刷新数据</button></div></header>
<section class="page-heading"><h1 id="title">关键词池</h1><button id="export">导出 CSV</button></section>
<div id="status" role="status" aria-live="polite"></div><section id="stats" class="stats" aria-label="工作区概览"></section>
<section class="panel"><div class="panel-top"><div><h2 id="table-title">全部关键词</h2><span id="result-count"></span></div><label class="search"><input id="search" type="search" aria-label="搜索关键词、站点或页面" placeholder="搜索关键词、站点或页面"></label></div>
<div id="filters" class="filters"><label>建站状态<select id="status-filter" aria-label="建站状态"><option value="">全部状态</option><option value="observing">观察中</option><option value="abandoned">已放弃</option><option value="building">开发中</option><option value="live">已上线</option></select></label><label>站点与页面<select id="site-filter" aria-label="站点与页面"><option value="">全部关联</option><option value="linked">已关联</option><option value="unlinked">未关联</option></select></label><label>排序<select id="sort" aria-label="排序"></select></label><button id="direction" aria-label="切换为升序">降序 ↓</button><button id="clear-filters">重置</button></div>
<div id="bulk" class="bulk" hidden><strong id="selected-count"></strong><label>审核<select id="bulk-state"><option value="approved">认可</option><option value="hold">暂缓</option><option value="rejected">不认可</option></select></label><label>建站决定<select id="bulk-decision"><option value="unset">尚未决定</option><option value="build">决定建设</option><option value="defer">暂缓</option><option value="abandon">放弃</option></select></label><input id="actor" aria-label="审核人" value="owner" placeholder="审核人"><input id="reason" aria-label="审核原因" placeholder="审核原因"><button id="save-reviews" class="primary">保存审核</button><button id="deselect">取消选择</button></div>
<div id="content" class="table-wrap"></div><div id="pagination" class="pagination"></div></section>
</main>
<dialog id="detail"><div class="dialog-head"><span>记录详情</span><button id="close-detail" aria-label="关闭详情">关闭</button></div><div id="dialog-status" role="status" aria-live="polite"></div><div id="detail-content"></div></dialog>
</body></html>
