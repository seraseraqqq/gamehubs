<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GameHubs · 站群工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#keywords"><span class="brandmark">G</span> GameHubs<span class="local">LOCAL</span></a><div class="workspace">SEO 游戏站群 / 管理工作区</div><nav aria-label="主导航"><button data-view="keywords" class="active"><span>01</span> 关键词池 <b id="nav-count"></b></button><button data-view="batches"><span>02</span> 挖词批次</button><button data-view="builds"><span>03</span> 建站清单</button><button data-view="sites"><span>04</span> 网站目录</button></nav><div class="sidebar-note"><span class="online-dot"></span> 本地文件持久化<p>研究观察、人工决定与发布验收分别记录。通过 Git 手动同步数据。</p><button id="help">使用与同步说明 ↗</button></div></aside>
<main><header><div class="breadcrumb">工作区 <span>/</span> <span id="crumb">关键词池</span></div><div class="header-actions"><span id="sync-label">正在读取仓库…</span><button id="refresh">刷新数据</button></div></header>
<section class="page-heading"><div><div class="eyebrow">GAME PORTFOLIO WORKSPACE</div><h1 id="title">把值得做的词，逐个落成站。</h1><p id="subtitle">汇总每轮研究，保留全部结果，再由你决定下一步。</p></div><button id="export" class="primary">导出筛选结果 CSV ↗</button></section>
<div id="status" role="status" aria-live="polite"></div><section id="stats" class="stats" aria-label="工作区概览"></section>
<section class="panel"><div class="panel-top"><div><h2 id="table-title">全部关键词</h2><span id="result-count"></span></div><label class="search"><span>⌕</span><input id="search" type="search" aria-label="搜索关键词、站点或批次" placeholder="搜索关键词、站点、批次…"></label></div>
<div id="filters" class="filters"><label>批次<select id="batch-filter"><option value="">全部批次</option></select></label><label>市场<select id="market-filter"><option value="">全部市场</option></select></label><label>研究资格<select id="qualification-filter"><option value="">全部资格</option><option value="qualified">合格</option><option value="rejected">不合格</option><option value="needs_review">待复核</option><option value="unknown">未知</option></select></label><label>人工审核<select id="review-filter"><option value="">全部审核</option><option value="pending">未审核</option><option value="approved">认可</option><option value="rejected">不认可</option><option value="hold">暂缓</option><option value="conflict">审核冲突</option></select></label><label>建站决定<select id="decision-filter"><option value="">全部决定</option><option value="build">决定建设</option><option value="defer">暂缓决定</option><option value="abandon">已放弃</option><option value="unset">尚未决定</option></select></label><label>上站状态<select id="stage-filter"><option value="">全部状态</option><option value="unlinked">未关联站点</option><option value="planned">计划中</option><option value="building">建设中</option><option value="awaiting_release">待验收/待发布</option><option value="blocked">有阻塞</option><option value="deployed">已部署（历史）</option><option value="abandoned">已放弃</option><option value="idea">构想</option></select></label><label>排序<select id="sort"><option value="priority">研究优先级</option><option value="term">名称 A–Z</option><option value="recent">最近批次</option><option value="observations">观察次数</option><option value="conflicts">待复核优先</option></select></label><button id="clear-filters">清除筛选</button></div>
<div id="bulk" class="bulk" hidden><strong id="selected-count"></strong><label>审核<select id="bulk-state"><option value="approved">认可</option><option value="hold">暂缓</option><option value="rejected">不认可</option></select></label><label>建站决定<select id="bulk-decision"><option value="unset">尚未决定</option><option value="build">决定建设</option><option value="defer">暂缓</option><option value="abandon">放弃</option></select></label><input id="actor" aria-label="审核人" value="owner" placeholder="审核人"><input id="reason" aria-label="审核原因" placeholder="填写审核原因（必填）"><button id="save-reviews" class="primary">保存审核到仓库</button><button id="deselect">取消选择</button></div>
<div id="content" class="table-wrap"></div><div id="pagination" class="pagination"></div></section>
<footer><span>唯一维护入口：data/ · 观察 / 审核 / 站点</span><span>没有自动提交、同步或线上操作</span></footer>
</main>
<dialog id="detail"><div class="dialog-head"><span class="eyebrow">记录详情</span><button id="close-detail" aria-label="关闭详情">✕</button></div><div id="dialog-status" role="status" aria-live="polite"></div><div id="detail-content"></div></dialog>
</body></html>
