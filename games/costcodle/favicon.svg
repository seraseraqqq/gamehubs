<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Zadely flat neo-brutalist sticker background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#e6ecff" stroke="#1b1f3b" stroke-width="3"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#d3dcfb" stroke-width="2"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#d3dcfb" stroke-width="2"/>

  <!-- Price tag shadow -->
  <path d="M16 18 L34 18 L48 32 L34 46 L16 46 Z" fill="#1b1f3b"/>
  <!-- Price tag sticker in warm yellow yolk -->
  <path d="M14 15 L32 15 L46 29 L32 43 L14 43 Z" fill="#ffd23f" stroke="#1b1f3b" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tag hole -->
  <circle cx="21" cy="22" r="3" fill="#e6ecff" stroke="#1b1f3b" stroke-width="2"/>
  <!-- Currency symbol text -->
  <text x="27" y="34" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="15" fill="#1b1f3b">$</text>
  <!-- Mini tomato red hotdog / barcode badge -->
  <rect x="36" y="36" width="16" height="16" rx="4" fill="#ff5a4e" stroke="#1b1f3b" stroke-width="2"/>
  <text x="41" y="49" font-family="Arial Black, sans-serif" font-weight="900" font-size="11" fill="#ffffff">?</text>
</svg>
