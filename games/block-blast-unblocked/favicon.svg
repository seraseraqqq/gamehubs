<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Zadely flat neo-brutalist sticker background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#e6ecff" stroke="#1b1f3b" stroke-width="3"/>
  <!-- Sheet subtle grid -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#d3dcfb" stroke-width="2"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#d3dcfb" stroke-width="2"/>

  <!-- 4 pop sticker blocks with hard ink shadow -->
  <!-- Shadow offset -->
  <rect x="11" y="14" width="18" height="18" rx="4" fill="#1b1f3b"/>
  <rect x="33" y="14" width="18" height="18" rx="4" fill="#1b1f3b"/>
  <rect x="11" y="36" width="18" height="18" rx="4" fill="#1b1f3b"/>
  <rect x="33" y="36" width="18" height="18" rx="4" fill="#1b1f3b"/>

  <!-- Color blocks with 2px ink border -->
  <rect x="9" y="11" width="18" height="18" rx="4" fill="#ffd23f" stroke="#1b1f3b" stroke-width="2"/>
  <rect x="31" y="11" width="18" height="18" rx="4" fill="#ff5a4e" stroke="#1b1f3b" stroke-width="2"/>
  <rect x="9" y="33" width="18" height="18" rx="4" fill="#3fa7ff" stroke="#1b1f3b" stroke-width="2"/>
  <rect x="31" y="33" width="18" height="18" rx="4" fill="#2ec27e" stroke="#1b1f3b" stroke-width="2"/>

  <!-- Highlights -->
  <rect x="11" y="13" width="4" height="4" rx="1.5" fill="#ffffff" opacity="0.8"/>
  <rect x="33" y="13" width="4" height="4" rx="1.5" fill="#ffffff" opacity="0.8"/>
  <rect x="11" y="35" width="4" height="4" rx="1.5" fill="#ffffff" opacity="0.8"/>
  <rect x="33" y="35" width="4" height="4" rx="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
